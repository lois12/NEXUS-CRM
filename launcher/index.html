<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS LAUNCHER</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #00ff88; --primary-dim: rgba(0,255,136,0.15); --glow: rgba(0,255,136,0.3);
      --bg: #0a0a0f; --border: rgba(0,255,136,0.12); --text: #e0e0e0; --text-dim: #6b7280;
      --cyan: #00d4ff; --purple: #bf00ff;
    }
    body { font-family: 'Inter', sans-serif; background: transparent; color: var(--text); overflow: hidden; user-select: none; }
    .window {
      width: 560px; height: 100vh; background: var(--bg); border-radius: 12px;
      border: 1px solid var(--border); overflow: hidden; position: relative;
      display: flex; flex-direction: column;
      box-shadow: 0 0 40px rgba(0,0,0,0.6), 0 0 80px rgba(0,255,136,0.05);
    }
    .window::before {
      content: ''; position: absolute; inset: 0;
      background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px; opacity: 0.3; pointer-events: none;
    }
    .titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: rgba(10,10,15,0.95);
      border-bottom: 1px solid var(--border); -webkit-app-region: drag; position: relative; z-index: 10; flex-shrink: 0;
    }
    .titlebar-left { display: flex; align-items: center; gap: 8px; }
    .titlebar-icon svg { width: 16px; height: 16px; color: var(--primary); filter: drop-shadow(0 0 6px var(--glow)); }
    .titlebar-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--primary); letter-spacing: 0.1em; text-shadow: 0 0 10px var(--glow); }
    .titlebar-controls { display: flex; gap: 6px; -webkit-app-region: no-drag; }
    .titlebar-btn {
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03); color: var(--text-dim); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    }
    .titlebar-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .titlebar-btn.close:hover { background: rgba(255,59,48,0.2); color: #ff3b30; border-color: rgba(255,59,48,0.3); }
    .titlebar-btn svg { width: 12px; height: 12px; }
    .content { padding: 14px; position: relative; z-index: 5; display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; overflow: hidden; }

    /* ── Logo ── */
    .logo-section { text-align: center; padding: 2px 0 0; flex-shrink: 0; }
    .logo-title { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; color: var(--primary); letter-spacing: 0.15em; text-shadow: 0 0 20px var(--glow); }
    .logo-sub { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); letter-spacing: 0.2em; }

    /* ── Server Tabs ── */
    .server-tabs { display: flex; gap: 6px; flex-shrink: 0; }
    .server-tab {
      flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      border-radius: 10px; cursor: pointer; transition: all 0.2s;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    }
    .server-tab:hover { border-color: rgba(255,255,255,0.12); }
    .server-tab.active.local { border-color: rgba(0,212,255,0.35); background: rgba(0,212,255,0.06); box-shadow: 0 0 15px rgba(0,212,255,0.1); }
    .server-tab.active.vps { border-color: rgba(191,0,255,0.35); background: rgba(191,0,255,0.06); box-shadow: 0 0 15px rgba(191,0,255,0.1); }
    .server-tab-icon { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .server-tab-icon svg { width: 14px; height: 14px; }
    .server-tab-icon.local { background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.2); }
    .server-tab-icon.local svg { color: var(--cyan); }
    .server-tab-icon.vps { background: rgba(191,0,255,0.1); border: 1px solid rgba(191,0,255,0.2); }
    .server-tab-icon.vps svg { color: var(--purple); }
    .server-tab-info { flex: 1; min-width: 0; }
    .server-tab-name { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: var(--text); }
    .server-tab-meta { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); }
    .server-tab-status { display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; }
    .s-stopped { background: rgba(107,114,128,0.15); color: #6b7280; }
    .s-stopped .status-dot { background: #6b7280; }
    .s-starting { background: rgba(234,179,8,0.15); color: #eab308; }
    .s-starting .status-dot { background: #eab308; animation: pulse 1s ease-in-out infinite; }
    .s-building { background: rgba(0,212,255,0.15); color: var(--cyan); }
    .s-building .status-dot { background: var(--cyan); animation: pulse 0.8s ease-in-out infinite; }
    .s-running { background: rgba(0,255,136,0.1); color: var(--primary); }
    .s-running .status-dot { background: var(--primary); box-shadow: 0 0 6px var(--glow); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── Panel ── */
    .panel { display: none; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
    .panel.active { display: flex; }

    /* ── Glass ── */
    .glass { background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

    /* ── Actions ── */
    .actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
    .btn {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
      padding: 7px 12px; border-radius: 8px; border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 5px; transition: all 0.2s;
    }
    .btn svg { width: 12px; height: 12px; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary-dim); }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 0 25px var(--glow); transform: translateY(-1px); }
    .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid rgba(255,255,255,0.08); }
    .btn-secondary:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
    .btn-danger { background: rgba(255,59,48,0.1); color: #ff3b30; border: 1px solid rgba(255,59,48,0.2); }
    .btn-danger:hover:not(:disabled) { background: rgba(255,59,48,0.2); }
    .btn-deploy {
      background: linear-gradient(135deg, rgba(191,0,255,0.15), rgba(0,212,255,0.15));
      color: var(--purple); border: 1px solid rgba(191,0,255,0.25);
    }
    .btn-deploy:hover:not(:disabled) { background: linear-gradient(135deg, rgba(191,0,255,0.25), rgba(0,212,255,0.25)); box-shadow: 0 0 20px rgba(191,0,255,0.15); transform: translateY(-1px); }
    .btn-deploy:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-deploy.running { animation: deploy-pulse 1.5s ease-in-out infinite; }
    @keyframes deploy-pulse { 0%, 100% { border-color: rgba(191,0,255,0.25); } 50% { border-color: rgba(191,0,255,0.6); box-shadow: 0 0 15px rgba(191,0,255,0.15); } }
    .btn-ghost { background: none; border: 1px solid rgba(255,255,255,0.06); color: var(--text-dim); font-size: 9px; padding: 4px 8px; }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.05); color: var(--text); }

    /* ── Quick links ── */
    .quick-links { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; }
    .quick-link {
      font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim);
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px; padding: 4px 8px; cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; gap: 4px;
    }
    .quick-link:hover { background: rgba(255,255,255,0.06); color: var(--text); border-color: rgba(255,255,255,0.12); }
    .quick-link svg { width: 10px; height: 10px; }
    .db-info { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); }
    .db-info .size { color: var(--primary); opacity: 0.8; }

    /* ── Port warning ── */
    .port-warning {
      font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #eab308;
      display: none; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px;
      background: rgba(234,179,8,0.08); border: 1px solid rgba(234,179,8,0.15); flex-shrink: 0;
    }
    .port-warning.visible { display: flex; }

    /* ── Settings ── */
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 10px; border-radius: 8px;
      background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); flex-shrink: 0;
    }
    .settings-row label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .settings-row input[type="checkbox"] { accent-color: var(--primary); width: 14px; height: 14px; cursor: pointer; }

    /* ── Log ── */
    .log-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; flex-shrink: 0; }
    .log-title { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--primary); letter-spacing: 0.1em; display: flex; align-items: center; gap: 4px; }
    .log-title svg { width: 10px; height: 10px; }
    .log-controls { display: flex; gap: 3px; align-items: center; }
    .log-clear { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); background: none; border: none; cursor: pointer; padding: 2px 4px; border-radius: 3px; transition: all 0.15s; }
    .log-clear:hover { color: var(--text); background: rgba(255,255,255,0.05); }
    .log-area {
      background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.04); border-radius: 6px;
      padding: 6px 8px; flex: 1; min-height: 0; overflow-y: auto;
      font-family: 'JetBrains Mono', monospace; font-size: 9px; line-height: 1.5; color: var(--text-dim);
      word-break: break-all; overflow-wrap: break-word; white-space: pre-wrap;
    }
    .log-area::-webkit-scrollbar { width: 3px; }
    .log-area::-webkit-scrollbar-thumb { background: var(--primary); opacity: 0.3; border-radius: 2px; }
    .log-line { padding: 1px 0; }
    .log-line .time { color: #4a4a60; margin-right: 3px; }
    .log-line.info { color: #60a5fa; }
    .log-line.success { color: var(--primary); }
    .log-line.error { color: #ff3b30; }
    .log-line.warn { color: #eab308; }
    .log-line.system { color: #a78bfa; }

    /* ── Footer ── */
    .footer { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.04); flex-shrink: 0; }
    .footer-link {
      font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); text-decoration: none; cursor: pointer;
      display: flex; align-items: center; gap: 3px; padding: 3px 6px; border-radius: 5px; transition: all 0.15s;
    }
    .footer-link:hover { color: var(--primary); background: var(--primary-dim); }
    .footer-link svg { width: 10px; height: 10px; }
    .hotkey-hint { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: #3a3a50; letter-spacing: 0.05em; }

    .scanline { position: absolute; inset: 0; z-index: 100; pointer-events: none; overflow: hidden; }
    .scanline::before {
      content: ''; position: absolute; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      box-shadow: 0 0 10px var(--primary), 0 0 20px var(--glow);
      animation: sweep 1.5s ease-out forwards;
    }
    @keyframes sweep { 0% { top: -2px; opacity: 1; } 100% { top: 100%; opacity: 0; } }
    .resize-handle { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; cursor: nwse-resize; z-index: 20; }
    .resize-handle::before { content: ''; position: absolute; bottom: 3px; right: 3px; width: 6px; height: 6px; border-right: 2px solid rgba(255,255,255,0.12); border-bottom: 2px solid rgba(255,255,255,0.12); }
  </style>
</head>
<body>
  <div class="window" id="window">
    <div class="scanline" id="scanline"></div>

    <div class="titlebar">
      <div class="titlebar-left">
        <div class="titlebar-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <span class="titlebar-title">NEXUS LAUNCHER</span>
      </div>
      <div class="titlebar-controls">
        <button class="titlebar-btn" id="btn-min" title="Свернуть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="titlebar-btn close" id="btn-close" title="Закрыть">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="content">
      <div class="logo-section">
        <div class="logo-title">NEXUS</div>
        <div class="logo-sub">CRM // LAUNCHER</div>
      </div>

      <!-- Server Tabs -->
      <div class="server-tabs">
        <div class="server-tab local active" id="tab-local">
          <div class="server-tab-icon local">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          </div>
          <div class="server-tab-info">
            <div class="server-tab-name">LOCAL</div>
            <div class="server-tab-meta">localhost:8080</div>
          </div>
          <div class="server-tab-status s-stopped" id="be-status">
            <span class="status-dot"></span><span id="be-status-text">OFFLINE</span>
          </div>
        </div>
        <div class="server-tab vps" id="tab-vps">
          <div class="server-tab-icon vps">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
          </div>
          <div class="server-tab-info">
            <div class="server-tab-name">VPS</div>
            <div class="server-tab-meta">nexus-liberty.online</div>
          </div>
          <div class="server-tab-status s-stopped" id="vps-status">
            <span class="status-dot"></span><span id="vps-status-text">OFFLINE</span>
          </div>
        </div>
      </div>

      <!-- ── LOCAL Panel ── -->
      <div class="panel active" id="panel-local">
        <div class="port-warning" id="port-warning">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span id="port-warning-text">Порт занят</span>
          <button class="btn-ghost" id="btn-kill-port">ОСВОБОДИТЬ</button>
        </div>
        <div class="actions">
          <button class="btn btn-primary" id="btn-start">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg> ЗАПУСК
          </button>
          <button class="btn btn-danger" id="btn-stop">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg> СТОП
          </button>
          <button class="btn btn-secondary" id="btn-restart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg> РЕСТАРТ
          </button>
          <button class="btn btn-secondary" id="btn-build-fe">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg> FE
          </button>
          <button class="btn btn-secondary" id="btn-build-be">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/></svg> BE
          </button>
          <button class="btn btn-secondary" id="btn-open-local" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> ОТКРЫТЬ
          </button>
        </div>
        <div class="quick-links">
          <button class="quick-link" id="ql-uploads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> uploads</button>
          <button class="quick-link" id="ql-db"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg> nexus.db <span class="db-info"><span class="size" id="db-size">—</span></span></button>
          <button class="quick-link" id="ql-editor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> VS Code</button>
        </div>
        <div class="log-section">
          <div class="log-header">
            <div class="log-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg> // LOCAL LOG</div>
            <div class="log-controls">
              <button class="log-clear" id="btn-export-local" title="Экспорт">EXP</button>
              <button class="log-clear" id="btn-clear-local">CLR</button>
            </div>
          </div>
          <div class="log-area" id="log-local"></div>
        </div>
      </div>

      <!-- ── VPS Panel ── -->
      <div class="panel" id="panel-vps">
        <div class="actions">
          <button class="btn btn-deploy" id="btn-deploy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg> ДЕПЛОЙ
          </button>
          <button class="btn btn-secondary" id="btn-open-vps">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> ОТКРЫТЬ
          </button>
        </div>
        <div class="log-section">
          <div class="log-header">
            <div class="log-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg> // VPS LOG</div>
            <div class="log-controls">
              <button class="log-clear" id="btn-export-vps" title="Экспорт">EXP</button>
              <button class="log-clear" id="btn-clear-vps">CLR</button>
            </div>
          </div>
          <div class="log-area" id="log-vps"></div>
        </div>
      </div>

      <!-- Settings -->
      <div class="settings-row">
        <label><input type="checkbox" id="chk-autostart"> Автозапуск</label>
        <label><input type="checkbox" id="chk-tray" checked> Сворачивать в трей</label>
      </div>

      <!-- Footer -->
      <div class="footer">
        <div style="display:flex;gap:4px;">
          <a class="footer-link" id="link-app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/></svg> localhost</a>
          <a class="footer-link" id="link-vps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/></svg> nexus-liberty.online</a>
        </div>
        <span class="hotkey-hint">Ctrl+Shift+N</span>
      </div>
    </div>
    <div class="resize-handle"></div>
  </div>

  <script>
    const { ipcRenderer, shell } = require('electron');

    // ── State ──
    const logs = { local: [], vps: [] };
    let settings = ipcRenderer.sendSync('get-settings');
    let uptimeTimers = {};

    // ── Elements ──
    const beStatus = document.getElementById('be-status');
    const beStatusText = document.getElementById('be-status-text');
    const vpsStatus = document.getElementById('vps-status');
    const vpsStatusText = document.getElementById('vps-status-text');
    const logLocal = document.getElementById('log-local');
    const logVps = document.getElementById('log-vps');
    const btnOpenLocal = document.getElementById('btn-open-local');

    // ── Tab switching ──
    function switchTab(tab) {
      document.querySelectorAll('.server-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    }
    document.getElementById('tab-local').addEventListener('click', () => switchTab('local'));
    document.getElementById('tab-vps').addEventListener('click', () => switchTab('vps'));

    // ── Settings ──
    document.getElementById('chk-autostart').checked = settings.autoStart || false;
    document.getElementById('chk-tray').checked = settings.minimizeToTray !== false;
    document.getElementById('chk-autostart').addEventListener('change', (e) => { settings.autoStart = e.target.checked; ipcRenderer.send('save-settings', settings); });
    document.getElementById('chk-tray').addEventListener('change', (e) => { settings.minimizeToTray = e.target.checked; ipcRenderer.send('save-settings', settings); });

    // ── Scanline ──
    setTimeout(() => document.getElementById('scanline').style.display = 'none', 1600);

    // ── Window ──
    document.getElementById('btn-min').addEventListener('click', () => ipcRenderer.send('minimize-window'));
    document.getElementById('btn-close').addEventListener('click', () => ipcRenderer.send('close-window'));

    // ── LOCAL buttons ──
    document.getElementById('btn-start').addEventListener('click', () => { ipcRenderer.send('start-all'); addLog('local', 'Запуск сервера...', 'system'); });
    document.getElementById('btn-stop').addEventListener('click', () => { ipcRenderer.send('stop-all'); addLog('local', 'Остановка сервера...', 'warn'); });
    document.getElementById('btn-restart').addEventListener('click', () => { ipcRenderer.send('restart-all'); addLog('local', 'Рестарт...', 'system'); });
    document.getElementById('btn-build-fe').addEventListener('click', () => { ipcRenderer.send('build-frontend'); addLog('local', 'Сборка фронтенда...', 'system'); });
    document.getElementById('btn-build-be').addEventListener('click', () => { ipcRenderer.send('build-backend'); addLog('local', 'Сборка бэкенда...', 'system'); });
    btnOpenLocal.addEventListener('click', () => ipcRenderer.send('open-browser'));

    // ── VPS buttons ──
    document.getElementById('btn-open-vps').addEventListener('click', () => shell.openExternal('https://nexus-liberty.online'));
    const btnDeploy = document.getElementById('btn-deploy');
    btnDeploy.addEventListener('click', () => {
      ipcRenderer.send('deploy');
      btnDeploy.disabled = true; btnDeploy.classList.add('running');
    });
    ipcRenderer.on('deploy-status', (_, status) => {
      if (status === 'running') { btnDeploy.disabled = true; btnDeploy.classList.add('running'); }
      else { btnDeploy.disabled = false; btnDeploy.classList.remove('running'); }
      if (status === 'success') addLog('vps', 'Деплой успешен! Сайт обновлён.', 'success');
      if (status === 'failed') addLog('vps', 'Деплой провален.', 'error');
    });

    // ── Quick links ──
    document.getElementById('ql-uploads').addEventListener('click', () => ipcRenderer.send('open-uploads'));
    document.getElementById('ql-db').addEventListener('click', () => ipcRenderer.send('open-db'));
    document.getElementById('ql-editor').addEventListener('click', () => ipcRenderer.send('open-in-editor'));

    // ── Footer ──
    document.getElementById('link-app').addEventListener('click', () => ipcRenderer.send('open-browser'));
    document.getElementById('link-vps').addEventListener('click', () => shell.openExternal('https://nexus-liberty.online'));

    // ── Status helpers ──
    function setTabStatus(el, textEl, status) {
      el.className = 'server-tab-status s-' + status;
      textEl.textContent = { stopped: 'OFFLINE', building: 'СБОРКА', starting: 'ЗАПУСК', running: 'ONLINE' }[status] || status;
    }

    ipcRenderer.on('backend-status', (_, s) => {
      setTabStatus(beStatus, beStatusText, s);
      btnOpenLocal.disabled = s !== 'running';
      if (s === 'running') { addLog('local', 'ONLINE', 'success'); startUptime('be'); }
      if (s === 'building') addLog('local', 'Сборка...', 'system');
      if (s === 'stopped') { addLog('local', 'OFFLINE', 'warn'); stopUptime('be'); }
    });

    ipcRenderer.on('vps-status', (_, s) => {
      setTabStatus(vpsStatus, vpsStatusText, s);
      if (s === 'running') { addLog('vps', 'ONLINE', 'success'); }
      if (s === 'stopped') { addLog('vps', 'OFFLINE', 'warn'); }
    });

    // Sync VPS state every poll cycle
    ipcRenderer.on('vps-state', (_, { status }) => {
      setTabStatus(vpsStatus, vpsStatusText, status);
    });

    ipcRenderer.on('auto-start-triggered', () => addLog('local', 'Автозапуск...', 'system'));

    // ── Uptime ──
    function startUptime(id) { if (uptimeTimers[id]) clearInterval(uptimeTimers[id]); uptimeTimers[id] = 1; /* status dot handles it */ }
    function stopUptime(id) { delete uptimeTimers[id]; }

    // ── DB size ──
    function updateDbSize(bytes) {
      const el = document.getElementById('db-size');
      if (!bytes) { el.textContent = '—'; return; }
      const k = 1024, sizes = ['B','KB','MB','GB'], i = Math.floor(Math.log(bytes)/Math.log(k));
      el.textContent = parseFloat((bytes/Math.pow(k,i)).toFixed(1)) + ' ' + sizes[i];
    }
    ipcRenderer.on('db-size-update', (_, bytes) => updateDbSize(bytes));
    updateDbSize(ipcRenderer.sendSync('get-db-size'));

    // ── Port kill ──
    document.getElementById('btn-kill-port').addEventListener('click', async () => {
      addLog('local', 'Освобождение порта 8080...', 'warn');
      const ok = await ipcRenderer.invoke('kill-port', 8080);
      addLog('local', ok ? 'Порт освобождён' : 'Не удалось', ok ? 'success' : 'error');
      if (ok) document.getElementById('port-warning').classList.remove('visible');
    });

    // ── Logs ──
    function addLog(target, text, type = '') {
      const time = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const arr = logs[target]; arr.push({ text, type, time });
      if (arr.length > 300) arr.splice(0, arr.length - 300);
      const area = target === 'local' ? logLocal : logVps;
      const line = document.createElement('div');
      line.className = 'log-line' + (type ? ' ' + type : '');
      line.innerHTML = `<span class="time">${time}</span>${text.replace(/</g,'&lt;')}`;
      area.appendChild(line);
      area.scrollTop = area.scrollHeight;
      while (area.children.length > 300) area.removeChild(area.firstChild);
    }

    // ── Export / Clear ──
    document.getElementById('btn-clear-local').addEventListener('click', () => { logs.local = []; logLocal.innerHTML = ''; });
    document.getElementById('btn-clear-vps').addEventListener('click', () => { logs.vps = []; logVps.innerHTML = ''; });
    document.getElementById('btn-export-local').addEventListener('click', () => exportLogs('local'));
    document.getElementById('btn-export-vps').addEventListener('click', () => exportLogs('vps'));
    function exportLogs(target) {
      const content = logs[target].map(l => `${l.time} ${l.text}`).join('\n');
      ipcRenderer.invoke('export-logs', content).then(ok => { if (ok) addLog(target, 'Лог сохранён', 'system'); });
    }

    // ── Route backend-log to local ──
    ipcRenderer.on('backend-log', (_, data) => {
      data.split('\n').filter(l => l.trim()).forEach(line => {
        let type = '';
        if (/error/i.test(line)) type = 'error';
        else if (/warn/i.test(line)) type = 'warn';
        else if (/started|listening|Server|готов/i.test(line)) type = 'success';
        else if (/\[SYSTEM\]/.test(line)) type = 'system';
        else if (/\[VPS\]/.test(line)) { addLog('vps', line.trim().replace('[VPS] ',''), type || 'system'); return; }
        addLog('local', line.trim(), type);
      });
    });

    // ── Deploy log → VPS ──
    ipcRenderer.on('deploy-log', (_, data) => {
      data.split('\n').filter(l => l.trim()).forEach(line => {
        let type = '';
        if (/error|провален/i.test(line)) type = 'error';
        else if (/OK|успешен|завершён/i.test(line)) type = 'success';
        else if (/Шаг|старт|Деплой/i.test(line)) type = 'system';
        addLog('vps', line.trim(), type);
      });
    });

    ipcRenderer.on('frontend-log', (_, data) => {
      data.split('\n').filter(l => l.trim()).forEach(line => {
        let type = '';
        if (/error/i.test(line)) type = 'error';
        else if (/ready|Local:/i.test(line)) type = 'success';
        addLog('local', line.trim(), type);
      });
    });

    // ── Hotkeys ──
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); ipcRenderer.send('start-all'); }
      if (e.ctrlKey && e.key === 'q') { e.preventDefault(); ipcRenderer.send('stop-all'); }
      if (e.ctrlKey && e.key === 'd') { e.preventDefault(); if (!btnDeploy.disabled) ipcRenderer.send('deploy'); }
    });
  </script>
</body>
</html>
