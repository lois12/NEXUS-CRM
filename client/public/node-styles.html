<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    min-height: 100vh;
  }
  h1 { text-align: center; font-size: 28px; color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.4); margin-bottom: 8px; letter-spacing: 0.15em; }

  .node-preview { width: 120px; height: 120px; position: relative; display: flex; align-items: center; justify-content: center; }
  .label { font-size: 12px; font-weight: 600; color: #00ff88; text-transform: uppercase; letter-spacing: 0.05em; }

  .pick-btn.selected { background: rgba(0,255,136,0.3); }

  /* ========== ORIGINAL 8 STYLES ========== */
  .holo-orb { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4) 0%, transparent 40%), radial-gradient(circle at 50% 50%, #00ff88 0%, #008844 40%, #003322 70%, transparent 100%); box-shadow: 0 0 20px rgba(0,255,136,0.5), 0 0 60px rgba(0,255,136,0.2), inset 0 0 30px rgba(0,255,136,0.3); animation: holo-pulse 3s ease-in-out infinite; }
  .holo-orb::before { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 1px solid rgba(0,255,136,0.15); animation: holo-ring 4s linear infinite; }
  .holo-orb::after { content: ''; position: absolute; inset: 5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.5) 0%, transparent 50%); }
  @keyframes holo-pulse { 0%,100%{box-shadow:0 0 20px rgba(0,255,136,0.5),0 0 60px rgba(0,255,136,0.2)} 50%{box-shadow:0 0 30px rgba(0,255,136,0.7),0 0 80px rgba(0,255,136,0.3)} }
  @keyframes holo-ring { 0%{transform:rotate(0deg);border-color:rgba(0,255,136,0.2)} 50%{border-color:rgba(0,212,255,0.3)} 100%{transform:rotate(360deg);border-color:rgba(0,255,136,0.2)} }

  .plasma { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, rgba(255,200,100,0.5), transparent 30%), radial-gradient(circle at 60% 60%, rgba(255,100,50,0.4), transparent 30%), radial-gradient(circle at 50% 50%, #ff6600, #cc3300 40%, #661100 70%, transparent 100%); box-shadow: 0 0 30px rgba(255,102,0,0.5), 0 0 80px rgba(255,50,0,0.2), inset 0 0 40px rgba(255,150,50,0.3); animation: plasma-dance 4s ease-in-out infinite; }
  .plasma::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(255,150,50,0.3) 25%, transparent 50%, rgba(255,100,0,0.2) 75%, transparent); animation: plasma-spin 3s linear infinite; }
  @keyframes plasma-dance { 0%,100%{border-radius:50%} 25%{border-radius:48% 52% 50% 50%} 50%{border-radius:50% 48% 52% 50%} 75%{border-radius:50% 50% 48% 52%} }
  @keyframes plasma-spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

  .ice { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.6), transparent 30%), radial-gradient(circle at 70% 70%, rgba(100,200,255,0.3), transparent 40%), linear-gradient(135deg, rgba(100,200,255,0.4), rgba(50,100,200,0.2) 50%, rgba(20,40,80,0.3)); border: 1px solid rgba(100,200,255,0.3); box-shadow: 0 0 20px rgba(100,200,255,0.3), 0 0 60px rgba(50,150,255,0.1), inset 0 0 20px rgba(200,230,255,0.2); position: relative; }

  .wireframe { width: 90px; height: 90px; position: relative; animation: wire-rotate 8s linear infinite; transform-style: preserve-3d; }
  .wireframe .ring { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(0,255,136,0.5); }
  .wireframe .ring:nth-child(2) { transform: rotateX(60deg); border-color: rgba(0,212,255,0.4); }
  .wireframe .ring:nth-child(3) { transform: rotateY(60deg); border-color: rgba(191,0,255,0.4); }
  .wireframe .ring:nth-child(4) { transform: rotateX(30deg) rotateY(30deg); border-color: rgba(0,255,136,0.3); }
  .wireframe .center { position: absolute; width: 16px; height: 16px; top: 37px; left: 37px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 15px rgba(0,255,136,0.8); }
  @keyframes wire-rotate { 0%{transform:rotateX(0deg) rotateY(0deg)} 100%{transform:rotateX(360deg) rotateY(180deg)} }

  .particle-cloud { width: 100px; height: 100px; position: relative; }
  .particle-cloud .dot { position: absolute; border-radius: 50%; background: #00ff88; animation: pfloat 3s ease-in-out infinite; }
  .particle-cloud .dot:nth-child(1){width:6px;height:6px;top:30px;left:40px} .particle-cloud .dot:nth-child(2){width:4px;height:4px;top:50px;left:60px;animation-delay:.3s;background:#00d4ff} .particle-cloud .dot:nth-child(3){width:5px;height:5px;top:20px;left:55px;animation-delay:.6s} .particle-cloud .dot:nth-child(4){width:3px;height:3px;top:60px;left:35px;animation-delay:.9s;background:#bf00ff} .particle-cloud .dot:nth-child(5){width:5px;height:5px;top:45px;left:25px;animation-delay:1.2s} .particle-cloud .dot:nth-child(6){width:4px;height:4px;top:35px;left:70px;animation-delay:1.5s;background:#00d4ff} .particle-cloud .dot:nth-child(7){width:6px;height:6px;top:55px;left:50px;animation-delay:.4s} .particle-cloud .dot:nth-child(8){width:3px;height:3px;top:25px;left:30px;animation-delay:.8s;background:#bf00ff}
  .particle-cloud .cloud-glow { position: absolute; width: 80px; height: 80px; top: 10px; left: 10px; border-radius: 50%; background: radial-gradient(circle, rgba(0,255,136,0.12), transparent 70%); animation: cloud-pulse 4s ease-in-out infinite; }
  @keyframes pfloat { 0%,100%{transform:translateY(0) scale(1);opacity:0.8} 50%{transform:translateY(-8px) scale(1.3);opacity:1} }
  @keyframes cloud-pulse { 0%,100%{transform:scale(1);opacity:0.5} 50%{transform:scale(1.15);opacity:0.8} }

  .liquid { width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.5), transparent 25%), radial-gradient(circle at 65% 65%, rgba(0,0,0,0.4), transparent 30%), linear-gradient(145deg, #c0c0c0, #808080 30%, #404040 60%, #202020); box-shadow: 0 0 15px rgba(150,150,150,0.3), inset 0 0 20px rgba(255,255,255,0.1); animation: liquid-morph 5s ease-in-out infinite; }
  @keyframes liquid-morph { 0%,100%{border-radius:50%} 20%{border-radius:45% 55% 50% 50%} 40%{border-radius:50% 45% 55% 50%} 60%{border-radius:50% 50% 45% 55%} 80%{border-radius:55% 50% 50% 45%} }

  .blackhole { width: 100px; height: 100px; position: relative; }
  .blackhole .core { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, #000 40%, #111); position: absolute; top: 30px; left: 30px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
  .blackhole .ring { position: absolute; border-radius: 50%; border: 1.5px solid transparent; border-top-color: rgba(0,255,136,0.5); border-right-color: rgba(0,212,255,0.3); }
  .blackhole .ring-1 { width: 60px; height: 60px; top: 20px; left: 20px; animation: bh-spin 2s linear infinite; }
  .blackhole .ring-2 { width: 80px; height: 80px; top: 10px; left: 10px; animation: bh-spin 3s linear infinite reverse; border-top-color: rgba(191,0,255,0.4); }
  .blackhole .ring-3 { width: 100px; height: 100px; animation: bh-spin 4s linear infinite; border-top-color: rgba(0,255,136,0.2); opacity: 0.6; }
  .blackhole .accretion { position: absolute; width: 70px; height: 70px; top: 15px; left: 15px; border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(0,255,136,0.15) 20%, transparent 40%, rgba(0,212,255,0.1) 60%, transparent 80%); animation: bh-spin 2s linear infinite; filter: blur(3px); }
  @keyframes bh-spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

  /* ========== EXTRA COSMIC STYLES (42) ========== */
  .supernova{width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,#fff,#ff6600 20%,#ff0066 40%,#6600cc 60%,transparent 80%);box-shadow:0 0 40px #ff6600,0 0 80px #ff006644,0 0 120px #6600cc22;animation:supernova-burst 4s ease-in-out infinite}
  @keyframes supernova-burst{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.15);filter:brightness(1.5)}}

  .quasar{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#fff 5%,#00d4ff 20%,#0066ff 40%,#001144 70%,transparent 85%);box-shadow:0 0 30px #00d4ff,0 0 60px #0066ff88,0 0 100px #00d4ff44;animation:quasar-pulse 2s ease-in-out infinite}

  .magnetar-field{width:105px;height:105px;border-radius:50%;background:radial-gradient(circle,#ff00ff 10%,#6600cc 40%,#1a0033 70%,transparent 85%);box-shadow:0 0 25px #ff00ff,0 0 50px #6600cc66;position:relative;animation:magnetar-field-pulse 3s ease-in-out infinite}

  @keyframes magnetar-field-pulse{0%,100%{box-shadow:0 0 25px #ff00ff,0 0 50px #6600cc66}50%{box-shadow:0 0 40px #ff00ff,0 0 80px #6600cc88}}
  @keyframes magnetar-field-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

  .pulsar-wind{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#fff 8%,#00ffcc 25%,#006644 50%,#001a11 75%,transparent 90%);box-shadow:0 0 20px #00ffcc,0 0 40px #00ffcc66;animation:pulsar-wind-beam 1.5s ease-in-out infinite}
  @keyframes pulsar-wind-beam{0%,100%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.1,0.9) rotate(5deg)}50%{transform:scale(1) rotate(0deg)}75%{transform:scale(0.9,1.1) rotate(-5deg)}}

  .wormhole{width:105px;height:105px;border-radius:50%;background:conic-gradient(from 0deg,#000 0%,#1a0033 25%,#000 50%,#1a0033 75%,#000 100%);box-shadow:0 0 20px #bf00ff44,inset 0 0 30px #000;position:relative;animation:wormhole-spin 4s linear infinite}

  .nebula-cloud{width:110px;height:100px;border-radius:60% 40% 50% 50%/50% 60% 40% 50%;background:radial-gradient(ellipse at 30% 40%,#ff00ff33,transparent 50%),radial-gradient(ellipse at 70% 60%,#00d4ff33,transparent 50%),radial-gradient(ellipse at 50% 50%,#bf00ff22,#330055 60%,#0d001a);box-shadow:0 0 30px #bf00ff44;animation:nebula-cloud-drift 8s ease-in-out infinite}
  @keyframes nebula-cloud-drift{0%,100%{border-radius:60% 40% 50% 50%/50% 60% 40% 50%}25%{border-radius:40% 60% 45% 55%/60% 40% 55% 45%}50%{border-radius:55% 45% 60% 40%/40% 55% 45% 60%}75%{border-radius:45% 55% 40% 60%/55% 45% 60% 40%}}

  .comet{width:95px;height:95px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff,#00d4ff 30%,#0066aa 60%,transparent 80%);box-shadow:0 0 15px #00d4ff,15px 0 30px #00d4ff44,30px 0 45px #00d4ff22;animation:comet-fly 3s ease-in-out infinite}
  @keyframes comet-fly{0%,100%{transform:translateX(0) scale(1)}50%{transform:translateX(10px) scale(0.95)}}

  .solar-wind{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#ffcc00 10%,#ff6600 30%,#cc3300 50%,#330000 80%,transparent 95%);box-shadow:0 0 25px #ff6600,0 0 50px #ff660066;animation:solar-wind-blow 4s ease-in-out infinite}
  .solar-wind::before{content:'';position:absolute;inset:-5px;border-radius:50%;border:1px solid #ff660033;animation:solar-wind-expand 3s ease-out infinite}
  @keyframes solar-wind-blow{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

  .black-hole{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#000 35%,#000 50%,#bf00ff11 65%,#00d4ff0a 80%,transparent 95%);box-shadow:0 0 0 3px #bf00ff22,0 0 30px #000,inset 0 0 50px #000;position:relative;animation:black-hole-pulse 5s ease-in-out infinite}
  .black-hole::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid #bf00ff22;animation:black-hole-accrete 6s linear infinite;background:conic-gradient(from 0deg,transparent,#bf00ff11 25%,transparent 50%,#00d4ff0a 75%,transparent)}

  {cls:'node-cube',name:'Rotating Cube'},{cls:'node-octahedron',name:'Octahedron'},{cls:'node-icosahedron',name:'Icosahedron'},
  {cls:'node-dodecahedron',name:'Dodecahedron'},{cls:'node-hexprism',name:'Hex Prism'},{cls:'node-pyramid',name:'Pyramid'},

];

function makeCard(item) {
  const inner = item.cls === 'blackhole'
    ? '<div class="blackhole"><div class="accretion"></div><div class="core"></div><div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div></div>'
    : item.cls === 'wireframe'
    ? '<div class="wireframe"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="center"></div></div>'
    : item.cls === 'particle-cloud'
    ? '<div class="particle-cloud"><div class="cloud-glow"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>'
    : `<div class="${item.cls}"></div>`;
  return `<div class="card"><div class="node-preview">${inner}</div><div class="label">${item.name}</div><button class="pick-btn" onclick="pick(this,'${item.cls}')">ВЫБРАТЬ</button></div>`;
}

document.getElementById('original').innerHTML = original.map(makeCard).join('');
document.getElementById('glow').innerHTML = glow.map(makeCard).join('');
document.getElementById('organic').innerHTML = organic.map(makeCard).join('');
document.getElementById('tech').innerHTML = tech.map(makeCard).join('');
document.getElementById('geo').innerHTML = geo.map(makeCard).join('');

function pick(btn, cls) {
  document.querySelectorAll('.pick-btn').forEach(b => { b.textContent = 'ВЫБРАТЬ'; b.classList.remove('selected'); });
  btn.textContent = '✓ ВЫБРАНО';
  btn.classList.add('selected');
  console.log('Selected:', cls);
}
</script>
